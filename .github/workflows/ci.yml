name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell Installer Syntax & Encodings
        shell: powershell
        run: |
          # 1. Web installers (install.ps1, uninstall.ps1) MUST NOT have BOM (to prevent irm | iex \uFEFF parser error)
          $noBomScripts = @("install.ps1", "uninstall.ps1")
          foreach ($rel in $noBomScripts) {
              $fullPath = Resolve-Path $rel
              $bytes = [System.IO.File]::ReadAllBytes($fullPath)
              if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
                  Write-Error "File $rel MUST NOT have UTF-8 BOM (breaks 'irm | iex' param parsing)!"
                  exit 1
              }
              Write-Host "Verified UTF-8 No-BOM for: $rel"
          }

          # 2. Validate AST syntax for installer PowerShell scripts
          $allScripts = Get-ChildItem -Recurse -Filter *.ps1
          foreach ($s in $allScripts) {
              Write-Host "Validating AST for: $($s.FullName)"
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $errors | ForEach-Object { Write-Error $_ }
                  exit 1
              }
          }
          Write-Host "All PowerShell scripts passed encoding and AST syntax check."

      - name: Validate Bash Script Syntax
        shell: bash
        run: |
          if command -v bash >/dev/null 2>&1; then
              bash -n scripts/title.sh
              bash -n install.sh
              bash -n uninstall.sh
              echo "All Bash scripts passed syntax validation."
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'

      - name: Build & Test Go Native Engine (Windows, Linux, macOS)
        shell: bash
        run: |
          go vet ./...
          go test -v ./...
          GOOS=windows GOARCH=amd64 go build -v -ldflags="-s -w" -o title.exe ./cmd/title
          GOOS=linux GOARCH=amd64 go build -v -ldflags="-s -w" -o title_linux ./cmd/title
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o title_darwin ./cmd/title
          echo "All native binary targets compiled successfully."
